# Shared properties
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# NOTE: org.gradle.java.home is intentionally NOT pinned here. A hardcoded JDK path
# breaks fresh clones and CI, which is why the modules request a Java 25 toolchain instead.

# Mod Properties
mod_id=aeonis
mod_name=Aeonis
mod_version=5.0.0
mod_group_id=com.qc.aeonis
maven_group=com.qc.aeonis
archives_base_name=AeonisCM
mod_license=GPL-3.0-or-later

# Kotlin toolchain (shared by all modules)
kotlin_version=2.4.20

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3]

# Fabric
# Verified against https://github.com/FabricMC/fabric-example-mod (branch 26.3)
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_kotlin_version=1.14.1+kotlin.2.4.20
fabric_version=0.161.0+26.3
modmenu_version=21.0.0-beta.1

# NeoForge
neo_version=26.3.0.6-beta
neoforge_gradle_version=7.1.39
# NOTE: KotlinForForge (KFF) does not yet support Minecraft 26.3. Its upstream 6.x
# branch sets `unsupported_mc_version = 26.3`, and the newest published build
# (6.3.0a) declares a Minecraft dependency range of "[1.21.9,26.3)". See TODO.md.
kotlinforforge_version=6.3.0

# AI / ML
onnxruntime_version=1.20.0
